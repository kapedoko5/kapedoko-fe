name: Sync to Vercel repo
on:
  push:
    branches: [main, staging, "release/**"]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push branch to kapedoko5
        run: |
          git remote add vercel "https://x-access-token:${{ secrets.VERCEL_REPO_TOKEN }}@github.com/kapedoko5/kapedoko-fe.git"
          git push vercel "HEAD:${{ github.ref_name }}"
