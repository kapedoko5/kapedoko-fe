name: Sync to Vercel repo
on:
  push:
    branches: [main, staging, "release/**"]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push branch to kapedoko5
        env:
          VERCEL_REPO_TOKEN: ${{ secrets.VERCEL_REPO_TOKEN }}
        run: |
          if [ -z "$VERCEL_REPO_TOKEN" ]; then
            echo "VERCEL_REPO_TOKEN is empty. Add it as a repository secret on KapeDoko/kapedoko-fe."
            exit 1
          fi
          git remote add vercel "https://x-access-token:${VERCEL_REPO_TOKEN}@github.com/kapedoko5/kapedoko-fe.git"
          git push vercel "HEAD:${{ github.ref_name }}"
